
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: student_management
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appuser -d student_management"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://appuser:${POSTGRES_PASSWORD}@db:5432/student_management
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
